[project]
name = "unshacklarr"
version = "1.3.1"
description = "Downloads the episodes Sonarr is missing with unshackle, then has Sonarr import them."
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
dependencies = [
    "aiohttp>=3.9",
    "apprise>=1.8",
    "cryptography>=42",  # push.py: the VAPID public key, as a browser takes it
    "py-vapid>=1.9",  # push.py: the key that signs this server's pushes
    "pywebpush>=2.0",
    "pyyaml>=6",
    "requests>=2.31",
]

[project.scripts]
unshacklarr = "unshacklarr.web:main"

[dependency-groups]
test = ["pytest>=8", "responses>=0.25"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["unshacklarr"]
